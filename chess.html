<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chess</title>
  <style>
    #outer{
      height: 800px;
      width: 800px;
      border: 1px solid;
    }
    #r1,#r2,#r3,#r4,#r5,#r6,#r7,#r8{
      display: flex;
    }
    #white{
      height: 100px;
      width: 100px;
      background: white;
    }
    #black{
      height: 100px;
      width: 100px;
      background: black;
    }
  </style>
</head>
<body>
  <div id="outer">
    <div id="r1">
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
    </div>
    <div id="r2">
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
    </div>
    <div id="r3">
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
    </div>
    <div id="r4">
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
    </div>
    <div id="r5">
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
    </div>
    <div id="r6">
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
    </div>
    <div id="r7">
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
    </div>
    <div id="r8">
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
      <div id="black"></div>
      <div id="white"></div>
    </div>
  </div>
</body>
</html>
